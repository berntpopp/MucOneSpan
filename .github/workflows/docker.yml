name: Docker

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-push:
    name: Build and Test Docker Image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Keep this job green for unrelated PRs instead of leaving a required
      # workflow pending through event-level path filters. Pushes always build.
      - name: Detect container inputs
        if: github.event_name == 'pull_request'
        id: changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          filters: |
            container:
              - 'src/**'
              - 'conda/**'
              - 'docker/**'
              - '.dockerignore'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'README.md'
              - 'Makefile'
              - 'scripts/check_container.sh'
              - '.github/workflows/**'
              - '.github/actions/**'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        if: steps.changes.outputs.container != 'false'
      - name: Build and test runtime in BuildKit
        if: steps.changes.outputs.container != 'false'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/Dockerfile
          target: test
          outputs: type=cacheonly
          push: false
          # PRs restore dependency layers and execute checks without exporting
          # or loading an image; only trusted main publication updates the cache.
          cache-from: type=gha,scope=runtime
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - name: Publish tested image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/Dockerfile
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The tested runtime is an ancestor of the test stage in this same
          # builder. Export its stable tools layer once, without builder copies.
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,scope=runtime,mode=min' || '' }}
