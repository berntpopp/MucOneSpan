name: Test & Quality

on:
  push:
    branches: [main, dev, 'dev/*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: '0.11.28'
  # Part of every uv cache key. setup-uv restores exact keys only, so bumping
  # this discards cached source builds; it was bumped when pyabpoa switched from
  # -march=native to the portable SSE4.1 build (pyproject.toml).
  UV_CACHE_EPOCH: 'portable-1'

jobs:
  quality:
    name: Code Quality Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      runtime: ${{ steps.changes.outputs.runtime }}
      package: ${{ steps.changes.outputs.package }}
      dependencies: ${{ steps.changes.outputs.dependencies }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Filter jobs, not workflow triggers: CI Gate must report on every PR base.
      # Pushes and manual runs always exercise the complete suite.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        if: github.event_name == 'pull_request'
        id: changes
        with:
          filters: |
            runtime:
              - 'src/**'
              - 'tests/**'
              - 'scripts/**'
              - 'conda/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'requirements*.txt'
              - 'requirements/**'
              - '.python-version'
              - 'Makefile'
              - '.github/workflows/**'
              - '.github/actions/**'
              - '.pre-commit-config.yaml'
              # Read by tests/unit/test_version_pins.py (pinned to version.py).
              - 'docker/muconespan.def'
              - 'docs/about/citation.md'
            package:
              - 'src/**'
              - 'scripts/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'requirements*.txt'
              - 'requirements/**'
              - '.python-version'
              - 'Makefile'
              - 'README.md'
              - 'LICENSE*'
              - '.github/workflows/**'
              - '.github/actions/**'
            dependencies:
              - 'pyproject.toml'
              - 'uv.lock'
              - 'requirements*.txt'
              - 'requirements/**'
              - '.python-version'
              - 'Makefile'
              - 'src/muc_one_span/version.py'
              - '.github/workflows/**'
              - '.github/actions/**'
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: '3.10'
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: quality-${{ env.UV_CACHE_EPOCH }}
      - run: make quality

  test:
    name: Test Suite (Python ${{ matrix.python }})
    needs: quality
    if: github.event_name != 'pull_request' || needs.quality.outputs.runtime == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: test-${{ matrix.python }}-${{ env.UV_CACHE_EPOCH }}
      # Every interpreter runs every unit test except the heavy safety sweeps (their own
      # job below); coverage is measured on the fastest supported interpreter.
      - if: matrix.python == '3.14'
        run: make test-core-cov
      - if: matrix.python != '3.14'
        run: make test-core
      # A cached or restored -march=native build may only crash on another CPU.
      - name: Verify portable compiled extensions
        run: make portable-check
      - name: Upload coverage
        if: matrix.python == '3.14'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false

  # The heavy synthetic safety sweeps (pytest marker safety_sweep: full pipeline runs on
  # synthetic samples; never NEGATIVE on a pathogenic minority, never PATHOGENIC on a
  # wild type). They run on every interpreter of the unit matrix, on every PR whose
  # runtime changed and on every push, with 4 xdist workers. Measured on a standard
  # runner (Python 3.12): 17m43s for the sweeps of 32f732e; the within-run event
  # sweeps add about 3 minutes (estimate). 45 minutes leaves room for slower
  # interpreters and runners.
  safety-sweeps:
    name: Safety Sweeps (Python ${{ matrix.python }})
    needs: quality
    if: github.event_name != 'pull_request' || needs.quality.outputs.runtime == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: sweeps-${{ matrix.python }}-${{ env.UV_CACHE_EPOCH }}
      - run: make test-sweeps

  integration:
    name: Integration Tests
    needs: quality
    if: github.event_name != 'pull_request' || needs.quality.outputs.runtime == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Restore the solved environment; its file/spec hash is appended by the action.
      - uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3
        with:
          micromamba-version: '2.9.0-0'
          environment-file: conda/environment.yml
          condarc: |
            channel_priority: strict
          cache-environment: true
          cache-environment-key: integration-ubuntu24-micromamba2.9
          cache-downloads: false
          init-shell: bash
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: '3.10'
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: integration-${{ env.UV_CACHE_EPOCH }}
      - name: Verify tools and run integration tests
        shell: bash -el {0}
        run: |
          minimap2 --version
          samtools --version
          bcftools --version
          make test-int

  package:
    name: Package Build
    needs: quality
    if: github.event_name != 'pull_request' || needs.quality.outputs.package == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: package-${{ env.UV_CACHE_EPOCH }}
      - run: make build-check

  security:
    name: Dependency Audit
    needs: quality
    if: github.event_name != 'pull_request' || needs.quality.outputs.dependencies == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: '3.10'
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: security-${{ env.UV_CACHE_EPOCH }}
      - run: make security-check

  gate:
    name: CI Gate
    if: always()
    needs: [quality, test, safety-sweeps, integration, package, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every applicable check to pass
        env:
          QUALITY: ${{ needs.quality.result }}
          TEST: ${{ needs.test.result }}
          SWEEPS: ${{ needs.safety-sweeps.result }}
          INTEGRATION: ${{ needs.integration.result }}
          PACKAGE: ${{ needs.package.result }}
          SECURITY: ${{ needs.security.result }}
          RUNTIME_REQUIRED: ${{ github.event_name != 'pull_request' || needs.quality.outputs.runtime == 'true' }}
          PACKAGE_REQUIRED: ${{ github.event_name != 'pull_request' || needs.quality.outputs.package == 'true' }}
          SECURITY_REQUIRED: ${{ github.event_name != 'pull_request' || needs.quality.outputs.dependencies == 'true' }}
        run: |
          test "$QUALITY" = success
          check_result() {
            if [ "$1" = true ]; then
              test "$2" = success
            else
              test "$2" = skipped || test "$2" = success
            fi
          }
          check_result "$RUNTIME_REQUIRED" "$TEST"
          check_result "$RUNTIME_REQUIRED" "$SWEEPS"
          check_result "$RUNTIME_REQUIRED" "$INTEGRATION"
          check_result "$PACKAGE_REQUIRED" "$PACKAGE"
          check_result "$SECURITY_REQUIRED" "$SECURITY"
