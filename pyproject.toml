[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "muc_one_span"
dynamic = ["version"]
description = "Open-source MUC1 VNTR analysis pipeline for PacBio HiFi and ONT amplicon data"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Bernt Popp", email = "bernt.popp.md@gmail.com"},
]
keywords = ["bioinformatics", "genomics", "MUC1", "VNTR", "PacBio", "HiFi", "ONT", "long-read"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    "click>=8.3.3,<9.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
report = [
    "jinja2>=3.1.0",
]
hybrid = [
    "edlib>=1.3.9",
    "pyabpoa>=1.5.7",
    "pyspoa>=0.3.2",
]
bench = [
    "edlib>=1.3; python_version < \"3.14\"",
]
docs = [
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=0.24.0",
    "mkdocs-click>=0.8.0",
]

[project.scripts]
muconespan = "muc_one_span.cli:main"

[project.urls]
Homepage = "https://github.com/berntpopp/MucOneSpan"
Documentation = "https://berntpopp.github.io/MucOneSpan/"
Repository = "https://github.com/berntpopp/MucOneSpan"
Issues = "https://github.com/berntpopp/MucOneSpan/issues"

[dependency-groups]
test = [
    "playwright>=1.40.0",
    "pytest>=9.0.3",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
]
quality = [
    "ruff==0.16.8",
    "mypy>=1.8.0",
    "types-PyYAML>=6.0",
    "actionlint-py==1.7.12.24",
]
security = ["pip-audit>=2.9,<3"]
dev = [
    {include-group = "test"},
    {include-group = "quality"},
    {include-group = "security"},
    "pre-commit>=4.0,<5",
]

[tool.uv]
cache-keys = [{file = "pyproject.toml"}, {file = "src/muc_one_span/version.py"}, {file = "README.md"}]
# Keep the minimum supported version; Dependabot supplies its own newer uv.
required-version = ">=0.11.28"
constraint-dependencies = [
    "idna>=3.15",
    "urllib3>=2.7.0",
    "pymdown-extensions>=11.0.1",
]

[tool.hatch.version]
path = "src/muc_one_span/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/muc_one_span"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests/__init__.py",
    "/tests/conftest.py",
    "/tests/unit",
    "/tests/integration",
    "/scripts",
    "/docs",
    "/examples",
    "/pyproject.toml",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/CITATION.cff",
    "/Makefile",
    "/mkdocs.yml",
    "/uv.lock",
    "/.python-version",
]
exclude = [
    "**/__pycache__",
    "**/*.pyc",
    "**/*.pyo",
    "**/*.bam",
    "**/*.bai",
    "**/*.cram",
    "**/*.crai",
    "**/*.fastq",
    "**/*.fastq.gz",
    "**/*.fq",
    "**/*.fq.gz",
    "**/*.fai",
    "**/*.mmi",
    "**/*.bwt",
    "**/*.pac",
    "**/*.ann",
    "**/*.amb",
    "**/*.sa",
]

[tool.ruff]
target-version = "py310"
line-length = 100
indent-width = 4
exclude = [
    ".git", ".mypy_cache", ".pytest_cache", ".ruff_cache",
    "__pycache__", "build", "dist", "*.egg-info",
]

[tool.ruff.lint]
select = [
    "E", "W", "F", "UP", "B", "SIM", "I", "N", "C4", "PTH", "RUF",
]
ignore = [
    "E501",
    "B008",
]
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ARG", "PLR2004"]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["muc_one_span"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--cov=muc_one_span",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]
markers = [
    "unit: pure Python tests (fast, no external tools)",
    "integration: tests requiring bioinformatics tools (conda env)",
    "e2e: end-to-end pipeline tests with MucOneUp test data",
]

[tool.coverage.run]
source = ["muc_one_span"]
branch = true
omit = ["*/tests/*", "*/__pycache__/*", "*/site-packages/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
