# Local hooks use the same uv.lock and whole-repository targets as CI.
repos:
  - repo: local
    hooks:
      - id: lint
        name: Ruff lint
        entry: make lint
        language: system
        pass_filenames: false
        types: [python]
      - id: format
        name: Ruff format check
        entry: make format-check
        language: system
        pass_filenames: false
        types: [python]
      - id: types
        name: Mypy
        entry: make type-check
        language: system
        pass_filenames: false
        types: [python]
      - id: file-size
        name: Source file size (<650 lines)
        entry: make file-size
        language: system
        pass_filenames: false
        always_run: true
      - id: workflows
        name: GitHub Actions validation
        entry: make workflow-check
        language: system
        pass_filenames: false
        files: ^\.github/workflows/
      - id: unit-tests
        name: Unit tests and coverage
        entry: make test-unit
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]
fail_fast: false
